<!DOCTYPE html>

<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Menu Item - FoodBook Admin</title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body>

<header class="navbar">

    <div class="logo">
        🍽️ FoodBook Admin
    </div>

    <nav>

        <a href="/">
            Home
        </a>

        <a href="/admin">
            Dashboard
        </a>

        <a href="/admin/restaurants">
            Restaurants
        </a>

        <a href="/admin/tables">
            Tables
        </a>

        <a href="/admin/bookings">
            Bookings
        </a>

        <a href="/admin/menu">
            Menu
        </a>

    </nav>

</header>


<section class="booking-section">

    <div class="booking-form-container">

        <p class="section-label">
            ADMIN PANEL
        </p>

        <h1>
            Add Menu Item
        </h1>

        <p class="form-subtitle">
            Add a new dish to a restaurant menu.
        </p>


        <form
            th:action="@{/admin/menu/save}"
            th:object="${menuItem}"
            method="post">


            <!-- RESTAURANT -->

            <div class="form-group">

                <label for="restaurantId">
                    Restaurant
                </label>

                <select
                    id="restaurantId"
                    th:field="*{restaurantId}"
                    required>

                    <option value="">
                        Select Restaurant
                    </option>

                    <option
                        th:each="restaurant : ${restaurants}"
                        th:value="${restaurant.id}"
                        th:text="${restaurant.name}">

                        Restaurant

                    </option>

                </select>

            </div>


            <!-- NAME -->

            <div class="form-group">

                <label for="name">
                    Dish Name
                </label>

                <input
                    type="text"
                    id="name"
                    th:field="*{name}"
                    placeholder="Enter dish name"
                    required>

            </div>


            <!-- DESCRIPTION -->

            <div class="form-group">

                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                    th:field="*{description}"
                    rows="4"
                    placeholder="Enter dish description"
                    required></textarea>

            </div>


            <!-- PRICE -->

            <div class="form-group">

                <label for="price">
                    Price
                </label>

                <input
                    type="number"
                    id="price"
                    th:field="*{price}"
                    min="0"
                    step="0.01"
                    placeholder="Enter price"
                    required>

            </div>


            <!-- CATEGORY -->

            <div class="form-group">

                <label for="category">
                    Category
                </label>

                <select
                    id="category"
                    th:field="*{category}"
                    required>

                    <option value="">
                        Select Category
                    </option>

                    <option value="Starter">
                        Starter
                    </option>

                    <option value="Main Course">
                        Main Course
                    </option>

                    <option value="Bread">
                        Bread
                    </option>

                    <option value="Beverage">
                        Beverage
                    </option>

                    <option value="Dessert">
                        Dessert
                    </option>

                </select>

            </div>


            <!-- IMAGE URL -->

            <div class="form-group">

                <label for="imageUrl">
                    Image URL
                </label>

                <input
                    type="url"
                    id="imageUrl"
                    th:field="*{imageUrl}"
                    placeholder="https://example.com/food.jpg">

            </div>


            <!-- SAVE -->

            <button
                type="submit"
                class="booking-button">

                Save Menu Item

            </button>


            <!-- BACK -->

            <a
                href="/admin/menu"
                class="btn-back">

                ← Back to Menu

            </a>

        </form>

    </div>

</section>


<footer>

    <p>
        © 2026 FoodBook.
        All rights reserved.
    </p>

</footer>

</body>

</html>
